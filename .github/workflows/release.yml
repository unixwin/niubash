name: Niubash Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Niubash tag to release, for example v0.7.1"
        required: true
        type: string
      winuxcmd_tag:
        description: "WinuxCmd tag to bundle; leave empty for latest release"
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: stable

jobs:
  build-windows:
    name: build-windows (${{ matrix.arch }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rust_target: x86_64-pc-windows-msvc
            winuxcmd_asset_pattern: "WinuxCmd-*-win-x64.zip"
          - arch: arm64
            rust_target: aarch64-pc-windows-msvc
            winuxcmd_asset_pattern: "WinuxCmd-*-win-arm64.zip"

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Checkout rubash path dependency
        run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/unixwin/rubash.git ../rubash

      - name: Checkout oh-my-niu bundle
        run: git clone --depth 1 https://github.com/unixwin/oh-my-niu.git ../oh-my-niu

      - name: Resolve release inputs
        id: release
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid release tag '$tag'"
          }
          $version = $tag.Substring(1)
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Preserve current release packager
        shell: pwsh
        run: |
          Copy-Item -LiteralPath scripts/package-release.ps1 -Destination (Join-Path $env:RUNNER_TEMP "package-release.ps1") -Force
          New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP "installer") | Out-Null
          Copy-Item -LiteralPath installer/niubash.iss -Destination (Join-Path $env:RUNNER_TEMP "installer\niubash.iss") -Force
          Copy-Item -LiteralPath assets/niubash-icon.ico -Destination (Join-Path $env:RUNNER_TEMP "niubash-icon.ico") -Force

      - name: Checkout release tag
        shell: pwsh
        run: |
          git fetch --tags --force
          git checkout "${{ steps.release.outputs.tag }}"
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "package-release.ps1") -Destination scripts/package-release.ps1 -Force
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "installer\niubash.iss") -Destination installer/niubash.iss -Force
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "niubash-icon.ico") -Destination assets/niubash-icon.ico -Force

      - name: Validate Cargo version matches release tag
        shell: pwsh
        run: |
          $cargoToml = Get-Content -LiteralPath Cargo.toml -Raw
          if ($cargoToml -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
            throw "Could not read package version from Cargo.toml"
          }
          if ($Matches[1] -ne "${{ steps.release.outputs.version }}") {
            throw "Cargo.toml version $($Matches[1]) does not match release tag ${{ steps.release.outputs.tag }}"
          }

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.11
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install Rust target
        run: rustup target add ${{ matrix.rust_target }}

      - name: Update rubash to latest master
        run: cargo update -p rubash

      - name: Build niubash
        env:
          RUSTFLAGS: ""
        run: cargo build --locked --release --target ${{ matrix.rust_target }}

      - name: Download architecture-matched WinuxCmd release
        id: winuxcmd
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "unixwin/WinuxCmd"
          $requestedTag = ""
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $requestedTag = "${{ inputs.winuxcmd_tag }}"
          }
          if ([string]::IsNullOrWhiteSpace($requestedTag)) {
            $releaseJson = gh release view --repo $repo --json tagName,assets | ConvertFrom-Json
          } else {
            $releaseJson = gh release view $requestedTag --repo $repo --json tagName,assets | ConvertFrom-Json
          }
          $asset = $releaseJson.assets |
            Where-Object { $_.name -like "${{ matrix.winuxcmd_asset_pattern }}" } |
            Select-Object -First 1
          if (-not $asset) {
            throw "No WinuxCmd asset matched ${{ matrix.winuxcmd_asset_pattern }} in $($releaseJson.tagName)"
          }

          $downloadDir = Join-Path $env:RUNNER_TEMP "winuxcmd-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null
          gh release download $releaseJson.tagName --repo $repo --pattern $asset.name --dir $downloadDir

          $extractDir = Join-Path $downloadDir "extract"
          Expand-Archive -LiteralPath (Join-Path $downloadDir $asset.name) -DestinationPath $extractDir -Force
          $winuxcmdExe = Get-ChildItem -LiteralPath $extractDir -Recurse -Filter winuxcmd.exe |
            Select-Object -First 1
          if (-not $winuxcmdExe) {
            throw "winuxcmd.exe not found in $($asset.name)"
          }

          "tag=$($releaseJson.tagName)" >> $env:GITHUB_OUTPUT
          "asset=$($asset.name)" >> $env:GITHUB_OUTPUT
          "exe=$($winuxcmdExe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Package release zip
        shell: pwsh
        run: |
          ./scripts/package-release.ps1 `
            -Version "${{ steps.release.outputs.version }}" `
            -WinuxCmdPath "${{ steps.winuxcmd.outputs.exe }}" `
            -OhMyNiubashBundlePath "..\oh-my-niu" `
            -Configuration release `
            -Target "${{ matrix.rust_target }}" `
            -Arch "${{ matrix.arch }}"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            throw "ISCC.exe not found after installing Inno Setup"
          }
          $sourceDir = Join-Path (Resolve-Path dist) "niubash-v${{ steps.release.outputs.version }}-win-${{ matrix.arch }}"
          $outputDir = Resolve-Path dist
          & $iscc installer\niubash.iss `
            "/DAppVersion=${{ steps.release.outputs.version }}" `
            "/DAppArch=${{ matrix.arch }}" `
            "/DSourceDir=$sourceDir" `
            "/DOutputDir=$outputDir"

      - name: Add latest-compatible asset aliases
        shell: pwsh
        run: |
          $versionedZip = "dist/niubash-v${{ steps.release.outputs.version }}-win-${{ matrix.arch }}.zip"
          $versionedSetup = "dist/niubash-v${{ steps.release.outputs.version }}-win-${{ matrix.arch }}-setup.exe"
          Copy-Item -LiteralPath $versionedZip -Destination "dist/niubash-win-${{ matrix.arch }}.zip" -Force
          Copy-Item -LiteralPath $versionedSetup -Destination "dist/niubash-win-${{ matrix.arch }}-setup.exe" -Force

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: niubash-v${{ steps.release.outputs.version }}-win-${{ matrix.arch }}
          path: |
            dist/niubash-v${{ steps.release.outputs.version }}-win-${{ matrix.arch }}.zip
            dist/niubash-v${{ steps.release.outputs.version }}-win-${{ matrix.arch }}-setup.exe
            dist/niubash-win-${{ matrix.arch }}.zip
            dist/niubash-win-${{ matrix.arch }}-setup.exe
          if-no-files-found: error
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    needs: build-windows
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Resolve release inputs
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.ref_name }}"
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Niubash ${{ steps.release.outputs.tag }}
          body: |
            Niubash ${{ steps.release.outputs.tag }} Windows packages.

            Packages are built remotely for x64 and ARM64. Portable zip packages remain available, and installer packages add user PATH and Windows Terminal profile integration.
          files: |
            artifacts/**/*.zip
            artifacts/**/*.exe
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true

  publish-crates:
    name: publish to crates.io
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Checkout rubash path dependency
        run: git clone --depth 1 https://github.com/unixwin/rubash.git ../rubash

      - name: Resolve release inputs
        id: release
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid release tag '$tag'"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Checkout release tag
        shell: pwsh
        run: |
          git fetch --tags --force
          git checkout "${{ steps.release.outputs.tag }}"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.11
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # Publishing needs version-annotated path deps so cargo can swap the
      # path for a registry dependency. The rubash deps carry no version yet
      # because rubash master is still 0.3.0 and CI path builds would fail
      # the ^1.0.0 check; re-add version = "1.0.0" once rubash 1.0.0 is on
      # crates.io.
      - name: Publish niubash-runtime to crates.io
        run: cargo publish --locked -p niubash-runtime --token ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish niubash to crates.io
        run: cargo publish --locked -p niubash --token ${{ secrets.CRATES_IO_TOKEN }}
