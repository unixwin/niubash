name: Niubash Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Niubash tag to release, for example v0.7.1"
        required: true
        type: string
      winuxcmd_tag:
        description: "WinuxCmd tag to bundle; leave empty for latest release"
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: stable

jobs:
  build-windows:
    name: build-windows (${{ matrix.arch }})
    runs-on: windows-2025
    outputs:
      # Both matrix legs clone the same rubash master, so this resolves to the
      # same value in both; the pin step fails the build if the checkout is
      # not a committed revision.
      rubash_revision: ${{ steps.rubash.outputs.revision }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rust_target: x86_64-pc-windows-msvc
            winuxcmd_asset_pattern: "WinuxCmd-*-win-x64.zip"
          - arch: arm64
            rust_target: aarch64-pc-windows-msvc
            winuxcmd_asset_pattern: "WinuxCmd-*-win-arm64.zip"

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Checkout rubash path dependency
        run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/unixwin/rubash.git ../rubash

      - name: Resolve release inputs
        id: release
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid release tag '$tag'"
          }
          $version = $tag.Substring(1)
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Preserve current release packager
        shell: pwsh
        run: |
          Copy-Item -LiteralPath scripts/package-release.ps1 -Destination (Join-Path $env:RUNNER_TEMP "package-release.ps1") -Force
          New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP "installer") | Out-Null
          Copy-Item -LiteralPath installer/niubash.iss -Destination (Join-Path $env:RUNNER_TEMP "installer\niubash.iss") -Force
          Copy-Item -LiteralPath assets/niubash-icon.ico -Destination (Join-Path $env:RUNNER_TEMP "niubash-icon.ico") -Force

      - name: Checkout release tag
        shell: pwsh
        run: |
          git fetch --tags --force
          git checkout "${{ steps.release.outputs.tag }}"
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "package-release.ps1") -Destination scripts/package-release.ps1 -Force
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "installer\niubash.iss") -Destination installer/niubash.iss -Force
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "niubash-icon.ico") -Destination assets/niubash-icon.ico -Force

      - name: Validate Cargo version matches release tag
        shell: pwsh
        run: |
          $cargoToml = Get-Content -LiteralPath Cargo.toml -Raw
          if ($cargoToml -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
            throw "Could not read package version from Cargo.toml"
          }
          if ($Matches[1] -ne "${{ steps.release.outputs.version }}") {
            throw "Cargo.toml version $($Matches[1]) does not match release tag ${{ steps.release.outputs.tag }}"
          }

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.11
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install Rust target
        run: rustup target add ${{ matrix.rust_target }}

      # rubash is a path dependency, so `cargo update -p rubash` cannot pin it:
      # there is no registry entry to update, and the step silently did nothing.
      # The revision the binary actually contains is resolved here and embedded
      # at build time by build.rs, so `niu --version` reports it.
      - name: Pin rubash revision
        id: rubash
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath ..\rubash)) {
            throw "rubash checkout missing at ..\rubash"
          }
          $revision = (git -C ..\rubash rev-parse --short=12 HEAD).Trim()
          if ([string]::IsNullOrWhiteSpace($revision)) {
            throw "could not resolve rubash revision"
          }
          $dirty = git -C ..\rubash status --porcelain
          if (-not [string]::IsNullOrWhiteSpace($dirty)) {
            throw "rubash checkout is dirty; a release must pin a committed revision`n$dirty"
          }
          Write-Host "rubash revision: $revision"
          "revision=$revision" >> $env:GITHUB_OUTPUT

      - name: Build niubash
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --locked --release --target ${{ matrix.rust_target }}

      - name: Download architecture-matched WinuxCmd release
        id: winuxcmd
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "unixwin/WinuxCmd"
          $requestedTag = ""
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $requestedTag = "${{ inputs.winuxcmd_tag }}"
          }
          if ([string]::IsNullOrWhiteSpace($requestedTag)) {
            $releaseJson = gh release view --repo $repo --json tagName,assets | ConvertFrom-Json
          } else {
            $releaseJson = gh release view $requestedTag --repo $repo --json tagName,assets | ConvertFrom-Json
          }
          $asset = $releaseJson.assets |
            Where-Object { $_.name -like "${{ matrix.winuxcmd_asset_pattern }}" } |
            Select-Object -First 1
          if (-not $asset) {
            throw "No WinuxCmd asset matched ${{ matrix.winuxcmd_asset_pattern }} in $($releaseJson.tagName)"
          }

          $downloadDir = Join-Path $env:RUNNER_TEMP "winuxcmd-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null
          gh release download $releaseJson.tagName --repo $repo --pattern $asset.name --dir $downloadDir

          $extractDir = Join-Path $downloadDir "extract"
          Expand-Archive -LiteralPath (Join-Path $downloadDir $asset.name) -DestinationPath $extractDir -Force
          $winuxcmdExe = Get-ChildItem -LiteralPath $extractDir -Recurse -Filter winuxcmd.exe |
            Select-Object -First 1
          if (-not $winuxcmdExe) {
            throw "winuxcmd.exe not found in $($asset.name)"
          }

          "tag=$($releaseJson.tagName)" >> $env:GITHUB_OUTPUT
          "asset=$($asset.name)" >> $env:GITHUB_OUTPUT
          "exe=$($winuxcmdExe.FullName)" >> $env:GITHUB_OUTPUT

      # niubash#189 — release pre-install, manifest-driven. wpm ships INSIDE
      # winuxcmd.exe (`winuxcmd wpm ...`), so the binary the step above
      # extracted is all the package manager this needs. The manifest
      # (scripts/release/preinstall.json) names the packages, the extra
      # command shims, and the owner-ordered exclusions (no compression
      # tools; goawk forbidden; `link` forbidden forever — MSVC collision);
      # tests/preinstall_manifest.rs pins that policy. The staged root mirrors
      # the shipped layout exactly (<root>\usr\bin\<cmd>.exe hardlink shims
      # forwarding to <root>\opt\<pkg>\ payloads), and package-release.ps1
      # copies both into the package.
      #
      # FAIL-OPEN (owner decision): pre-installing is an enhancement, not a
      # promise. A failed install (e.g. arm64 legs — the wpm index carries
      # windows-x64 artifacts only for these packages) is a loud ::warning
      # plus a step-summary line, never a release blocker; the verify step
      # below hard-asserts only what this step reports as installed, and the
      # release body discloses the caveat. Transport retries follow the repo
      # convention (perfbudget's Fetch-Pinned): 3 attempts with backoff, the
      # local proxy as the final-attempt fallback via wpm's --proxy flag.
      - name: Pre-install release packages (wpm, manifest-driven)
        id: preinstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $manifest = Get-Content -LiteralPath scripts/release/preinstall.json -Raw | ConvertFrom-Json
          $winuxcmdExe = "${{ steps.winuxcmd.outputs.exe }}"
          $root = Join-Path $env:RUNNER_TEMP "preinstall-root-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path (Join-Path $root "usr\bin") | Out-Null
          Copy-Item -LiteralPath $winuxcmdExe -Destination (Join-Path $root "usr\bin\winuxcmd.exe") -Force

          function Install-Package([string]$name) {
            # Attempt 1-2: direct. Attempt 3: local proxy fallback
            # (repo convention, cf. GIT_PERF_FALLBACK_PROXY in the
            # perfbudget gate).
            foreach ($attempt in 1..3) {
              $wpmArgs = @("wpm", "install", $name, "--root", $root, "--yes")
              if ($attempt -eq 3) {
                $wpmArgs += @("--proxy", "http://127.0.0.1:7897")
              }
              # Capture wpm's stdout+stderr into a variable (never the
              # pipeline): a function's return value is its whole output
              # stream, and a failed install's error text must not turn the
              # returned $false into a truthy string array. EAP is scoped to
              # Continue around the native call because Windows PowerShell
              # 5.1 turns `2>&1` stderr records into terminating
              # NativeCommandErrors under Stop — fail-open must survive
              # wpm's error text on both pwsh 7 and 5.1.
              $previousEap = $ErrorActionPreference
              $ErrorActionPreference = "Continue"
              $output = & $winuxcmdExe @wpmArgs 2>&1
              $ErrorActionPreference = $previousEap
              $output | ForEach-Object { Write-Host "$_" }
              if ($LASTEXITCODE -eq 0) { return $true }
              Write-Host "wpm install $name failed (attempt $attempt/3)"
              Start-Sleep -Seconds (5 * $attempt)
            }
            return $false
          }

          function New-CommandShim([string]$name) {
            $target = Join-Path $root "usr\bin\winuxcmd.exe"
            $shim = Join-Path $root "usr\bin\$name.exe"
            if (Test-Path -LiteralPath $shim) { return $true }
            try {
              New-Item -ItemType HardLink -Path $shim -Target $target -ErrorAction Stop | Out-Null
            }
            catch {
              # File systems without hardlink support still get a copy: the
              # shim dispatch only needs the winuxcmd.exe image by that name.
              $null = Copy-Item -LiteralPath $target -Destination $shim -Force
            }
            return (Test-Path -LiteralPath $shim)
          }

          $installed = @()
          $failed = @()
          foreach ($package in $manifest.packages) {
            if (Install-Package $package.name) {
              $installed += $package.name
              Write-Host "pre-installed: $($package.name)"
            }
            else {
              $failed += $package.name
              Write-Host "::warning::pre-install of '$($package.name)' failed on ${{ matrix.arch }} after retries; shipping WITHOUT it (fail-open, niubash#189)"
            }
          }

          $shimsMade = @()
          foreach ($shim in $manifest.shims) {
            # A shim may only reference an installed package's payload.
            if ($installed -notcontains $shim.target) { continue }
            if (New-CommandShim $shim.name) {
              $shimsMade += $shim.name
            }
            else {
              Write-Host "::warning::shim '$($shim.name)' could not be materialized (fail-open)"
            }
          }

          $summary = "### Pre-install (${{ matrix.arch }})`ninstalled: $(if ($installed) { $installed -join ', ' } else { 'none' })`nshims: $(if ($shimsMade) { $shimsMade -join ', ' } else { 'none' })`nfailed: $(if ($failed) { $failed -join ', ' } else { 'none' })"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
          "root=$root" >> $env:GITHUB_OUTPUT
          "installed=$($installed -join ',')" >> $env:GITHUB_OUTPUT
          "shims=$($shimsMade -join ',')" >> $env:GITHUB_OUTPUT
          "failed=$($failed -join ',')" >> $env:GITHUB_OUTPUT

      - name: Package release zip
        shell: pwsh
        run: |
          ./scripts/package-release.ps1 `
            -Version "${{ steps.release.outputs.version }}" `
            -WinuxCmdPath "${{ steps.winuxcmd.outputs.exe }}" `
            -PreinstallRoot "${{ steps.preinstall.outputs.root }}" `
            -Configuration release `
            -Target "${{ matrix.rust_target }}" `
            -Arch "${{ matrix.arch }}"

      # niubash#189 acceptance, enforced per-artifact: whatever the pre-install
      # step INSTALLED must work inside the staged package — `--version` on
      # every shim, and a bash-it plugin-shaped awk pipeline through the
      # PACKAGED niu.exe (the same `| awk '{print $1}'` shape the gradle
      # completion pipes through). What failed to install only warns
      # (fail-open); what installed but does not work fails the job.
      - name: Verify pre-installed packages in the staged release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $manifest = Get-Content -LiteralPath scripts/release/preinstall.json -Raw | ConvertFrom-Json
          $stage = "dist/niubash-v${{ steps.release.outputs.version }}-win-${{ matrix.arch }}"
          $installed = "${{ steps.preinstall.outputs.installed }}" -split "," | Where-Object { $_ }
          $failed = "${{ steps.preinstall.outputs.failed }}" -split "," | Where-Object { $_ }

          foreach ($failure in $failed) {
            Write-Host "::warning::release ships without pre-installed '$failure' (${{ matrix.arch }}; users can run winuxcmd wpm install $failure after install)"
          }

          $binDir = Join-Path $stage "winuxcmd\usr\bin"
          $shimNames = @($manifest.shims | ForEach-Object { $_.name }) + @($manifest.packages | ForEach-Object { $_.name })
          $shimNames = $shimNames | Select-Object -Unique
          foreach ($name in $shimNames) {
            $exe = Join-Path $binDir "$name.exe"
            if (-not (Test-Path -LiteralPath $exe)) {
              if ($installed.Count -gt 0) {
                throw "pre-install reported '$($installed -join ',')' installed but $exe is missing from the staged package"
              }
              continue
            }
            $out = & $exe --version 2>&1
            if ($LASTEXITCODE -ne 0 -or -not "$out") {
              throw "$name --version failed inside the staged package (exit $LASTEXITCODE)"
            }
            Write-Host "$name --version: $($out | Select-Object -First 1)"
          }

          if ($installed -contains "gawk") {
            $env:PATH = "$(Resolve-Path $binDir);$env:PATH"
            $niu = Join-Path $stage "niu.exe"
            $out = Write-Output "gradle-hash-input" | & $niu -c "awk '{print `$1}'"
            if ("$out" -ne "gradle-hash-input") {
              throw "plugin-shaped awk pipeline through the packaged niu.exe printed '$out' instead of 'gradle-hash-input'"
            }
            Write-Host "awk pipeline through packaged niu.exe: $out"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            throw "ISCC.exe not found after installing Inno Setup"
          }
          $sourceDir = Join-Path (Resolve-Path dist) "niubash-v${{ steps.release.outputs.version }}-win-${{ matrix.arch }}"
          $outputDir = Resolve-Path dist
          & $iscc installer\niubash.iss `
            "/DAppVersion=${{ steps.release.outputs.version }}" `
            "/DAppArch=${{ matrix.arch }}" `
            "/DSourceDir=$sourceDir" `
            "/DOutputDir=$outputDir"

      - name: Add latest-compatible asset aliases
        shell: pwsh
        run: |
          $versionedZip = "dist/niubash-v${{ steps.release.outputs.version }}-win-${{ matrix.arch }}.zip"
          $versionedSetup = "dist/niubash-v${{ steps.release.outputs.version }}-win-${{ matrix.arch }}-setup.exe"
          Copy-Item -LiteralPath $versionedZip -Destination "dist/niubash-win-${{ matrix.arch }}.zip" -Force
          Copy-Item -LiteralPath $versionedSetup -Destination "dist/niubash-win-${{ matrix.arch }}-setup.exe" -Force

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: niubash-v${{ steps.release.outputs.version }}-win-${{ matrix.arch }}
          path: |
            dist/niubash-v${{ steps.release.outputs.version }}-win-${{ matrix.arch }}.zip
            dist/niubash-v${{ steps.release.outputs.version }}-win-${{ matrix.arch }}-setup.exe
            dist/niubash-win-${{ matrix.arch }}.zip
            dist/niubash-win-${{ matrix.arch }}-setup.exe
          if-no-files-found: error
          retention-days: 1

  # Unix release legs. The engine's Linux port (rubash#225-#240) is closed
  # and the CI cross-check line is green, so the release pipeline ships what
  # CI compiles — but never unverified: each leg smoke-runs the exact binary
  # it uploads, on that OS, before any artifact leaves the job. A smoke
  # failure fails the job, so nothing untested can reach the release.
  #
  # No WinuxCmd bundling on Unix, and none of the Windows package-manager
  # surface either (standing platform red line): Unix has native coreutils,
  # and the compile-time cfg already keeps the Windows-only layer out of
  # non-Windows binaries.
  build-linux:
    name: build-linux (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    outputs:
      # Both matrix legs clone the same rubash master, so this resolves to
      # the same value in both; the pin step fails the build if the checkout
      # is not a committed revision.
      rubash_revision: ${{ steps.rubash.outputs.revision }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # gnu, not musl (released shape, recorded in docs/release.md):
          # musl is now compiled AND smoke-gated by `cross-target-smoke` in
          # ci.yml, so a musl leg no longer ships an untested libc surface —
          # but the released tarballs stay gnu until a consumer needs a
          # static build. Adding one is a delivery decision: add
          # rust_target: x86_64-unknown-linux-musl here. The glibc floor is
          # the build image's (2.35 on ubuntu-22.04): Ubuntu 22.04+,
          # Debian 12+. Move both legs forward together when the image
          # retires.
          - arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          # Native arm64 runner (free for public repos), not cross/qemu:
          # it compiles natively AND runs the smoke gate natively — the
          # whole point of the honest gate.
          - arch: aarch64
            rust_target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Checkout rubash path dependency
        run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/unixwin/rubash.git ../rubash

      - name: Resolve release inputs
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.ref_name }}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag '$tag'" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        run: |
          git fetch --tags --force
          git checkout "${{ steps.release.outputs.tag }}"

      - name: Validate Cargo version matches release tag
        run: |
          line="$(grep -m1 -E '^version[[:space:]]*=' Cargo.toml)"
          cargo_version="$(printf '%s' "$line" | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/')"
          if [ "$cargo_version" != "${{ steps.release.outputs.version }}" ]; then
            echo "Cargo.toml version '$cargo_version' does not match release tag ${{ steps.release.outputs.tag }}" >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.11
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # Same contract as build-windows: the revision the binary contains is
      # resolved here and embedded by build.rs, so `niu --version` reports it.
      - name: Pin rubash revision
        id: rubash
        run: |
          if [ ! -d ../rubash ]; then
            echo "rubash checkout missing at ../rubash" >&2
            exit 1
          fi
          revision="$(git -C ../rubash rev-parse --short=12 HEAD)"
          if [ -z "$revision" ]; then
            echo "could not resolve rubash revision" >&2
            exit 1
          fi
          dirty="$(git -C ../rubash status --porcelain)"
          if [ -n "$dirty" ]; then
            echo "rubash checkout is dirty; a release must pin a committed revision" >&2
            printf '%s\n' "$dirty" >&2
            exit 1
          fi
          echo "rubash revision: $revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      # No RUSTFLAGS here: crt-static is a Windows-leg choice; Linux gnu
      # binaries link the system glibc dynamically (the documented floor).
      - name: Build niubash
        run: cargo build --locked --release --target ${{ matrix.rust_target }}

      # HONEST GATE — smoke the binary this job just built, on this OS,
      # before anything is packaged or uploaded. A binary that cannot pass
      # these four checks on its build OS never becomes an artifact.
      - name: "Smoke-test built binary (gate: no smoke, no artifact)"
        run: |
          set -euo pipefail
          bin="target/${{ matrix.rust_target }}/release/niu"
          test -x "$bin"

          # 1) --version carries this release's version and the pinned engine
          #    revision (exact substrings pinned by
          #    tests/rubash_revision_banner.rs).
          out="$("$bin" --version)"
          printf '%s\n' "$out"
          grep -qF "Niubash ${{ steps.release.outputs.version }} " <<<"$out"
          grep -qF "rubash   git ${{ steps.rubash.outputs.revision }}" <<<"$out"

          # 2) one-shot engine execution
          out="$("$bin" -c 'echo ok')"
          [ "$out" = "ok" ]

          # 3) external commands + pipeline through native coreutils
          out="$(printf 'a\nb\n' | "$bin" -c 'sort | head -1')"
          [ "$out" = "a" ]

          # 4) plugin stack offline check: empty spec, isolated HOME —
          #    must exit 0 with zero output and touch no network.
          mkdir -p "$RUNNER_TEMP/smoke-home"
          : > "$RUNNER_TEMP/smoke-plugins.toml"
          out="$(HOME="$RUNNER_TEMP/smoke-home" \
            NIU_PLUGIN_SPEC="$RUNNER_TEMP/smoke-plugins.toml" \
            "$bin" plugin sync --bootstrap 2>&1)"
          if [ -n "$out" ]; then
            echo "plugin sync --bootstrap was not quiet on empty spec:" >&2
            printf '%s\n' "$out" >&2
            exit 1
          fi

          # Record the libc floor this binary actually requires.
          ldd --version | head -1

      - name: Package portable tarball
        run: |
          set -euo pipefail
          name="niubash-v${{ steps.release.outputs.version }}-linux-${{ matrix.arch }}"
          stage="dist/$name"
          mkdir -p "$stage"
          cp "target/${{ matrix.rust_target }}/release/niu" "$stage/niu"
          cp README.md LICENSE "$stage/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          tar -tzf "dist/$name.tar.gz"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: niubash-v${{ steps.release.outputs.version }}-linux-${{ matrix.arch }}
          path: dist/niubash-v${{ steps.release.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  # macos-13 (the Intel runner) is retired, so both macOS targets build on
  # the arm64 runner: aarch64 natively, x86_64 as a first-class Apple
  # cross-compile (same SDK), with its smoke gate run under Rosetta 2.
  build-macos:
    name: build-macos (${{ matrix.arch }})
    runs-on: macos-latest
    outputs:
      # Both matrix legs clone the same rubash master, so this resolves to
      # the same value in both; the pin step fails the build if the checkout
      # is not a committed revision.
      rubash_revision: ${{ steps.rubash.outputs.revision }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            rust_target: aarch64-apple-darwin
          - arch: x86_64
            rust_target: x86_64-apple-darwin
            rosetta: true

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Checkout rubash path dependency
        run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/unixwin/rubash.git ../rubash

      - name: Resolve release inputs
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.ref_name }}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag '$tag'" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        run: |
          git fetch --tags --force
          git checkout "${{ steps.release.outputs.tag }}"

      - name: Validate Cargo version matches release tag
        run: |
          line="$(grep -m1 -E '^version[[:space:]]*=' Cargo.toml)"
          cargo_version="$(printf '%s' "$line" | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/')"
          if [ "$cargo_version" != "${{ steps.release.outputs.version }}" ]; then
            echo "Cargo.toml version '$cargo_version' does not match release tag ${{ steps.release.outputs.tag }}" >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.11
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install Rust target
        run: rustup target add ${{ matrix.rust_target }}

      # Same contract as build-windows: the revision the binary contains is
      # resolved here and embedded by build.rs, so `niu --version` reports it.
      - name: Pin rubash revision
        id: rubash
        run: |
          if [ ! -d ../rubash ]; then
            echo "rubash checkout missing at ../rubash" >&2
            exit 1
          fi
          revision="$(git -C ../rubash rev-parse --short=12 HEAD)"
          if [ -z "$revision" ]; then
            echo "could not resolve rubash revision" >&2
            exit 1
          fi
          dirty="$(git -C ../rubash status --porcelain)"
          if [ -n "$dirty" ]; then
            echo "rubash checkout is dirty; a release must pin a committed revision" >&2
            printf '%s\n' "$dirty" >&2
            exit 1
          fi
          echo "rubash revision: $revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Build niubash
        run: cargo build --locked --release --target ${{ matrix.rust_target }}

      # Rosetta 2 lets the arm64 runner execute the cross-compiled x86_64
      # binary, so the smoke gate runs on real hardware either way.
      - name: Ensure Rosetta 2 (x86_64 leg)
        if: matrix.rosetta
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/true

      # HONEST GATE — same four checks as build-linux, on this OS. The
      # x86_64 leg runs them through `arch -x86_64` (Rosetta). The prefix
      # is an unquoted string (not an array): macOS steps may run under
      # bash 3.2, where expanding an empty array under `set -u` errors.
      - name: "Smoke-test built binary (gate: no smoke, no artifact)"
        run: |
          set -euo pipefail
          bin="target/${{ matrix.rust_target }}/release/niu"
          test -x "$bin"
          if [ "${{ matrix.rosetta }}" = "true" ]; then
            prefix="arch -x86_64"
          else
            prefix=""
          fi

          # 1) --version carries this release's version and the pinned engine
          #    revision (exact substrings pinned by
          #    tests/rubash_revision_banner.rs).
          out="$($prefix "$bin" --version)"
          printf '%s\n' "$out"
          grep -qF "Niubash ${{ steps.release.outputs.version }} " <<<"$out"
          grep -qF "rubash   git ${{ steps.rubash.outputs.revision }}" <<<"$out"

          # 2) one-shot engine execution
          out="$($prefix "$bin" -c 'echo ok')"
          [ "$out" = "ok" ]

          # 3) external commands + pipeline through native coreutils
          out="$(printf 'a\nb\n' | $prefix "$bin" -c 'sort | head -1')"
          [ "$out" = "a" ]

          # 4) plugin stack offline check: empty spec, isolated HOME —
          #    must exit 0 with zero output and touch no network.
          mkdir -p "$RUNNER_TEMP/smoke-home"
          : > "$RUNNER_TEMP/smoke-plugins.toml"
          out="$(HOME="$RUNNER_TEMP/smoke-home" \
            NIU_PLUGIN_SPEC="$RUNNER_TEMP/smoke-plugins.toml" \
            $prefix "$bin" plugin sync --bootstrap 2>&1)"
          if [ -n "$out" ]; then
            echo "plugin sync --bootstrap was not quiet on empty spec:" >&2
            printf '%s\n' "$out" >&2
            exit 1
          fi

          # Record what this binary was smoke-verified on.
          sw_vers
          uname -m

      - name: Package portable tarball
        run: |
          set -euo pipefail
          name="niubash-v${{ steps.release.outputs.version }}-macos-${{ matrix.arch }}"
          stage="dist/$name"
          mkdir -p "$stage"
          cp "target/${{ matrix.rust_target }}/release/niu" "$stage/niu"
          cp README.md LICENSE "$stage/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          tar -tzf "dist/$name.tar.gz"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: niubash-v${{ steps.release.outputs.version }}-macos-${{ matrix.arch }}
          path: dist/niubash-v${{ steps.release.outputs.version }}-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  journey:
    name: golden user journey (release gate)
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Checkout rubash path dependency
        run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/unixwin/rubash.git ../rubash

      - name: Resolve release inputs
        id: release
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid release tag '$tag'"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      # Same discipline as the packager preservation in build-windows: a
      # workflow_dispatch of an old tag must run the CURRENT journey gate
      # (old tags predate it), against that tag's own source build.
      - name: Preserve current journey gate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP "journey") | Out-Null
          Copy-Item -Recurse -LiteralPath scripts/journey -Destination (Join-Path $env:RUNNER_TEMP "journey") -Force

      - name: Checkout release tag
        shell: pwsh
        run: |
          git fetch --tags --force
          git checkout "${{ steps.release.outputs.tag }}"
          New-Item -ItemType Directory -Force -Path scripts | Out-Null
          # Remove-then-copy: Copy-Item -Recurse onto an EXISTING
          # scripts/journey (the tag carries the gate too) NESTS the
          # copy as scripts/journey/journey/ while the invoked file
          # stays the tag's stale version (release runs 2-5).
          if (Test-Path scripts/journey) { Remove-Item -Recurse -Force scripts/journey }
          Copy-Item -Recurse -LiteralPath (Join-Path $env:RUNNER_TEMP "journey") scripts/journey

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.11
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Build niu from the tag's own source
        run: cargo build --locked --release

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install journey dependencies
        run: pip install pywinpty pyte

      - name: Run the golden user journey
        shell: pwsh
        run: |
          # Deterministic gate delivery: take scripts/journey straight from
          # the dispatch ref's git object store (no temp dirs, no
          # Copy-Item semantics — runs 2-8). fetch-depth 0 guarantees the
          # ref is present.
          git checkout origin/master -- scripts/journey
          python scripts/journey/golden-journey.py `
            (Resolve-Path target/release/niu.exe) `
            --artifacts journey-artifacts

      - name: Upload journey verdict + transcripts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: journey-verdict
          path: journey-artifacts
          if-no-files-found: error
          retention-days: 14

  # Per-asset timing budget gate (owner directive 2026-10-04): EVERY theme
  # and plugin asset of every trusted source gets a measured time on every
  # release; any asset over its budget in scripts/perf/budgets.toml FAILS
  # the release. Same discipline as the journey gate: the CURRENT gate runs
  # against the tag's own build, with the asset sources pinned so measured
  # numbers stay comparable to the committed baseline
  # (scripts/perf/baselines/asset-timing-baseline.json).
  perfbudget:
    name: per-asset timing budget (release gate)
    runs-on: windows-2025
    timeout-minutes: 75
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Checkout rubash path dependency
        run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/unixwin/rubash.git ../rubash

      - name: Resolve release inputs
        id: release
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid release tag '$tag'"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      # Preserve the CURRENT gate before checking out the tag (old tags
      # predate it), exactly like the journey job.
      - name: Preserve current perfbudget gate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP "perf") | Out-Null
          Copy-Item -Recurse -LiteralPath scripts/perf -Destination (Join-Path $env:RUNNER_TEMP "perf") -Force

      - name: Checkout release tag
        shell: pwsh
        run: |
          git fetch --tags --force
          git checkout "${{ steps.release.outputs.tag }}"
          if (Test-Path scripts/perf) { Remove-Item -Recurse -Force scripts/perf }
          Copy-Item -Recurse -LiteralPath (Join-Path $env:RUNNER_TEMP "perf\perf") scripts/perf

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.11
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Build niu from the tag's own source
        run: cargo build --locked --release

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install perfbudget dependencies
        run: pip install pywinpty pyte

      # Pinned trusted sources — the SAME revisions the committed baseline
      # measured (ohmybash/oh-my-bash @ abf8461, Bash-it/bash-it @ 4725d29).
      # Bumping these pins changes every measured number and MUST come with
      # a re-recorded baseline in the same change. Fetch-by-SHA so the pin
      # stays honest even after the upstream branches move on.
      #
      # The pins are FULL 40-char object ids: a fetch REFSPEC is resolved
      # server-side as a ref NAME, so the old abbreviated form died before
      # measuring ("couldn't find remote ref abf8461", release run
      # 37224044818). TLS-resilient (wt87): 5 attempts with backoff; a
      # local operator whose git points at a dead proxy can set
      # GIT_PERF_FALLBACK_PROXY, tried as the final attempt (CI leaves it
      # unset — direct, like every other job). On total transport failure
      # the gate FAILS OPEN with a loud label: the missing source is
      # skipped (asset-timing.py measures the remaining tree; empty arg =
      # source disabled) and the verdict artifact carries
      # SKIPPED-<source>.txt — a flap must not kill the gate before it
      # measures, and a skip must never look like a measurement.
      - name: Checkout pinned asset sources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Fetch-Pinned([string]$owner, [string]$repo,
                                [string]$fullSha, [string]$dest) {
            # The fetch feeding the measurement was historically invisible
            # (that invisibility is how the 6s incident shipped): record
            # the wall time + attempt count per source into the verdict.
            $script:FetchLatency[$repo] = @{
              pin          = $fullSha
              started_utc  = (Get-Date).ToUniversalTime().ToString("o")
            }
            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            git init $dest
            git -C $dest remote add origin "https://github.com/$owner/$repo"
            $usedAttempts = 0
            foreach ($attempt in 1..5) {
              $usedAttempts = $attempt
              git -C $dest fetch --depth 1 origin $fullSha
              if ($LASTEXITCODE -eq 0) { break }
              if ($env:GIT_PERF_FALLBACK_PROXY -and $attempt -eq 5) {
                git -C $dest -c http.proxy="$env:GIT_PERF_FALLBACK_PROXY" `
                  fetch --depth 1 origin $fullSha
              }
              Start-Sleep -Seconds (5 * $attempt)
            }
            $sw.Stop()
            $script:FetchLatency[$repo].seconds = [math]::Round($sw.Elapsed.TotalSeconds, 2)
            $script:FetchLatency[$repo].attempts = $usedAttempts
            $script:FetchLatency[$repo].ok = ($LASTEXITCODE -eq 0)
            if ($LASTEXITCODE -ne 0) { return $false }
            git -C $dest checkout --quiet FETCH_HEAD
            return $true
          }
          function Note-Skipped([string]$source, [string]$pin) {
            "source $source @ $pin could not be fetched after retries " +
              "(TLS/transport) - the budget gate runs WITHOUT it; this is " +
              "a SKIP, not a measurement" |
              Set-Content "perfbudget-artifacts\SKIPPED-$source.txt"
            Write-Host "::warning::perfbudget skipped $source @ $pin after retries (transport); see perfbudget-artifacts/SKIPPED-$source.txt"
          }
          $script:FetchLatency = @{}
          New-Item -ItemType Directory -Force -Path perfbudget-artifacts | Out-Null
          if (Fetch-Pinned "ohmybash" "oh-my-bash" `
                "abf846186ab0a8a41ec5888e827ece6277dfe446" "..\oh-my-bash") {
            git -C ..\oh-my-bash checkout --quiet FETCH_HEAD
          } else { Note-Skipped "oh-my-bash" "abf8461" }
          if (Fetch-Pinned "Bash-it" "bash-it" `
                "4725d29db8c0ac8c21df47664b28539f3b8fce94" "..\bash-it") {
            git -C ..\bash-it checkout --quiet FETCH_HEAD
          } else { Note-Skipped "bash-it" "4725d29" }
          $script:FetchLatency | ConvertTo-Json |
            Set-Content perfbudget-artifacts\fetch-latency.json

      - name: Run the per-asset timing budget gate
        shell: pwsh
        run: |
          git checkout origin/master -- scripts/perf
          $ombArg = if (Test-Path ..\oh-my-bash\.git) { (Resolve-Path ..\oh-my-bash).Path } else { "" }
          $bashitArg = if (Test-Path ..\bash-it\.git) { (Resolve-Path ..\bash-it).Path } else { "" }
          python scripts/perf/asset-timing.py `
            --niu (Resolve-Path target/release/niu.exe) `
            --omb $ombArg `
            --bash-it $bashitArg `
            --run-dir "$env:RUNNER_TEMP\perfbudget-run" `
            --compare-baseline scripts/perf/baselines/asset-timing-baseline.json `
            --out perfbudget-artifacts/asset-timing.json

      - name: Upload perfbudget verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perfbudget-verdict
          path: perfbudget-artifacts
          if-no-files-found: error
          retention-days: 14

  # AI agent skill bundle (niubash#188): the same tree `niu skill install`
  # embeds, zipped with the WinuxCmd-skill layout (one top-level directory
  # holding SKILL.md + references/ + agents/) so agent hosts can consume
  # either the release zip or the installed dir interchangeably. The golden
  # region check runs here too — a release never ships a drifted bundle.
  skill-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Resolve release inputs
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.ref_name }}"
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Golden-check the skill bundle
        run: python scripts/test-skill-bundle.py

      - name: Package niubash-skill zip
        run: |
          mkdir -p dist
          (cd skills && zip -r "../dist/niubash-skill-v${{ steps.release.outputs.version }}.zip" niubash)
          unzip -l "dist/niubash-skill-v${{ steps.release.outputs.version }}.zip"

      - name: Verify zip layout (SKILL.md at niubash/ root)
        run: |
          set -eu
          test "$(unzip -l "dist/niubash-skill-v${{ steps.release.outputs.version }}.zip" | grep -c 'niubash/SKILL.md')" -eq 1
          unzip -l "dist/niubash-skill-v${{ steps.release.outputs.version }}.zip" | grep -q 'niubash/references/quickref.md'
          unzip -l "dist/niubash-skill-v${{ steps.release.outputs.version }}.zip" | grep -q 'niubash/agents/openai.yaml'

      - name: Upload skill bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: niubash-skill-v${{ steps.release.outputs.version }}
          path: dist/niubash-skill-v${{ steps.release.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos, journey, perfbudget, skill-bundle]
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Resolve release inputs
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.ref_name }}"
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # All three build jobs clone rubash master at dispatch time, so they
      # must have compiled the same revision. If they did not (a master
      # commit landed between two jobs' clones), the release would mix
      # engines across platforms — refuse instead.
      - name: Check engine revision agreement across build jobs
        run: |
          set -eu
          revs="${{ needs.build-windows.outputs.rubash_revision }}
          ${{ needs.build-linux.outputs.rubash_revision }}
          ${{ needs.build-macos.outputs.rubash_revision }}"
          unique="$(printf '%s\n' $revs | sed '/^$/d' | sort -u | wc -l | tr -d ' ')"
          if [ "$unique" -ne 1 ]; then
            echo "build jobs compiled different rubash revisions:" >&2
            printf '%s\n' $revs >&2
            exit 1
          fi
          echo "all platform builds compiled rubash git $(printf '%s\n' $revs | sed '/^$/d' | sort -u)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Niubash ${{ steps.release.outputs.tag }}
          body: |
            Niubash ${{ steps.release.outputs.tag }} packages for Windows, Linux, and macOS.

            Engine: rubash git ${{ needs.build-windows.outputs.rubash_revision }} — every platform build in this release compiled that same revision.
            Verify locally with `niu --version`, which prints the same revision.

            Windows (x64, ARM64): Inno Setup installers (`*-setup.exe`) add user PATH and Windows Terminal profile integration; portable zips bundle `niu` with WinuxCmd and bash/sh shims.

            Windows packages come with GNU awk pre-installed (niubash#189): gawk 5.4.1 lands in the bundled WinuxCmd root, and plain `awk` works too (a shim forwards to it), so bash-it plugins and completions that hard-depend on awk run out of the box. Pre-install is best-effort, not a promise: on legs where the package index has no matching artifact (currently the ARM64 builds) the package ships WITHOUT awk — run `winuxcmd wpm install gawk` once after installing to add it. The pre-install list and its recorded exclusions live in `scripts/release/preinstall.json`.

            `niubash-skill-v<version>.zip` is the AI agent skill bundle (SKILL.md + references, WinuxCmd-skill layout): unpack it into an agent skills directory, or let the shell do it — `niu skill install` embeds the same content.

            Linux (x86_64, aarch64; glibc): portable tarballs with the `niu` binary, README, and LICENSE — Unix builds bundle nothing, native system tools are used. Untar anywhere and run `./niu`.

            macOS (aarch64, x86_64): portable tarballs with the `niu` binary, README, and LICENSE. Untar anywhere and run `./niu`.

            Every artifact was smoke-verified on the build OS of the job that produced it, before upload: `niu -c 'echo ok'`, `printf 'a\nb\n' | niu -c 'sort | head -1'`, an offline `NIU_PLUGIN_SPEC=<empty> niu plugin sync --bootstrap` (exit 0, no output, no network), and a `niu --version` check against this tag and the engine revision.
          files: |
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.tar.gz
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true

  publish-crates:
    name: publish to crates.io
    runs-on: windows-latest
    # rubash is not yet published to crates.io, so cargo publish refuses the
    # bare path dependency. This job will start succeeding once rubash is on
    # crates.io; until then it is best-effort and must not block the release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Checkout rubash path dependency
        run: git clone --depth 1 https://github.com/unixwin/rubash.git ../rubash

      - name: Resolve release inputs
        id: release
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid release tag '$tag'"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Checkout release tag
        shell: pwsh
        run: |
          git fetch --tags --force
          git checkout "${{ steps.release.outputs.tag }}"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.11
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # Publishing needs version-annotated path deps so cargo can swap the
      # path for a registry dependency. The rubash dep carries no version yet
      # because rubash 1.0.0 is not on crates.io; `cargo publish` refuses a
      # bare path dependency. Re-add version = "1.0.0" once rubash 1.0.0 is
      # published.
      - name: Publish niubash-runtime to crates.io
        run: cargo publish --locked -p niubash-runtime --token ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish niubash to crates.io
        run: cargo publish --locked -p niubash --token ${{ secrets.CRATES_IO_TOKEN }}
