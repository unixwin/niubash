# Weekly refresh of docs/repo-stats.md — a one-page snapshot of repository
# vitals (master position, code/test volume, open issues, latest release).
#
# Runs weekly rather than per-push: the numbers only drift meaningfully over
# days, and per-push doc commits would collide with every in-flight PR. The
# commit is authored by github-actions[bot]; the workflow commits only when
# the snapshot actually changed.

name: repo-stats

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays, 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Regenerate docs/repo-stats.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commits=$(git rev-list --count HEAD)
          head_sha=$(git rev-parse --short HEAD)
          head_date=$(git log -1 --format=%cs)
          rs_files=$(git ls-files '*.rs' | wc -l)
          rs_loc=$(git ls-files '*.rs' | xargs wc -l | tail -1 | awk '{print $1}')
          test_files=$(git ls-files '*.rs' | grep -cE '(^|/)tests?/|_tests?\.rs$|(^|/)tests?\.rs$' || true)
          open_issues=$(gh issue list --state open --limit 1000 --json number --jq 'length')
          release=$(gh release view --json tagName --jq .tagName 2>/dev/null || echo "none")
          today=$(date -u +%Y-%m-%d)
          cat > docs/repo-stats.md <<EOF
          # Repository stats

          _Auto-generated by the repo-stats workflow on ${today}; do not edit by hand._

          | Metric | Value |
          |---|---|
          | Snapshot date | ${today} |
          | master HEAD | \`${head_sha}\` (${head_date}) |
          | Commits on master | ${commits} |
          | Rust source files | ${rs_files} |
          | Rust lines of code | ${rs_loc} |
          | Test-related .rs files | ${test_files} |
          | Open issues | ${open_issues} |
          | Latest release | ${release} |
          EOF

      - name: Open/update PR with refreshed stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add docs/repo-stats.md
          if git diff --cached --quiet -- docs/repo-stats.md; then
            echo "stats unchanged; nothing to commit"
            exit 0
          fi
          # master is protected (PR-required), so the bot pushes a branch and
          # merges its own PR instead of pushing master directly.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b bot/repo-stats
          git commit -m "docs: refresh repo-stats snapshot"
          git push -f origin bot/repo-stats
          pr_url=$(gh pr create --title "docs: refresh repo-stats snapshot" \
            --body "Automated weekly refresh of \`docs/repo-stats.md\` (repo-stats workflow)." \
            --head bot/repo-stats 2>/dev/null || true)
          pr=${pr_url:-$(gh pr list --head bot/repo-stats --state open --json number --jq '.[0].number')}
          gh pr merge "$pr" --merge --auto || \
            gh pr merge "$pr" --merge || \
            echo "PR $pr left open for manual merge"
