# Regenerate the all-contributors table + badge whenever .all-contributorsrc
# lands on master. The bot opens a PR rather than pushing master directly so
# the job keeps working if branch protection is tightened; it merges the PR
# itself when allowed, otherwise leaves it open.
#
# The all-contributors GitHub App (github.com/apps/allcontributors) is an
# optional companion: once installed it edits .all-contributorsrc from issue/PR
# comments like "@all-contributors please add @user for code" — those rc pushes
# then flow through this workflow to re-render the READMEs.

name: contributors-sync

on:
  push:
    branches: [master]
    paths:
      - .all-contributorsrc
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4

      - name: Regenerate contributors table + badge
        run: npx --yes all-contributors-cli@7.0.0 generate

      - name: Open/update PR with regenerated table
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "contributors table unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b bot/contributors-sync
          git commit -m "docs: regenerate all-contributors table"
          git push -f origin bot/contributors-sync
          pr_url=$(gh pr create --title "docs: regenerate all-contributors table" \
            --body "Regenerated by contributors-sync from \`.all-contributorsrc\`." \
            --head bot/contributors-sync 2>/dev/null || true)
          pr=${pr_url:-$(gh pr list --head bot/contributors-sync --state open --json number --jq '.[0].number')}
          gh pr merge "$pr" --merge --auto || \
            gh pr merge "$pr" --merge || \
            echo "PR $pr left open for manual merge"
