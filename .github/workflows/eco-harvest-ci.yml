name: eco-harvest-ci

# 采集安全化（#213）：不可信资产测试在一次性 ephemeral runner 上执行，
# 宿主机零暴露。harvest（纯 API 索引）在 ubuntu 上跑，test 需要真实
# ConPTY + WSL GNU 对照，跑在 windows-latest 上。

on:
  schedule:
    - cron: "30 21 * * *" # nightly 21:30 UTC，错开 perfbudget 的 03:23
  workflow_dispatch:
    inputs:
      tier:
        description: "harvest 层级: t1|t2|t3|t4|t5|all"
        default: "t1"
      test_tiers:
        description: "test 层级（windows runner）"
        default: "t1"

permissions:
  contents: write # 推 state 回 data 分支

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: restore state from data branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: eco-harvest-state
          path: eco-restore
      - name: seed state
        run: |
          mkdir -p eco/state eco/manifest
          if [ -d eco-restore/state ]; then cp -r eco-restore/state/. eco/state/; fi
      - name: harvest
        run: |
          python scripts/harvest/eco-harvest.py \
            --tier "${{ github.event.inputs.tier || 't1' }}" \
            --manifest-dir eco/manifest --state-dir eco/state
      - name: upload manifest + state
        uses: actions/upload-artifact@v4
        with:
          name: eco-manifest
          path: |
            eco/manifest
            eco/state
      - name: persist state to data branch
        run: |
          cd eco
          git init -q -b eco-harvest-state .
          git config user.name "eco-bot"
          git config user.email "actions@github.com"
          git add state
          git commit -qm "state: ${{ github.event.inputs.tier || 't1' }} @ $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" eco-harvest-state:eco-harvest-state

  test:
    needs: harvest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4 # niubash：eco 脚本 + niu 源码
      - uses: actions/checkout@v4
        with: { repository: unixwin/rubash, path: rubash }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: install test deps
        run: pip install pyte winpty
      - name: build niu (rubash engine)
        working-directory: rubash
        run: cargo build --release --bin bash --bin rubash
        continue-on-error: true # bin 名两仓库有别名，失败再试默认
      - name: build niu fallback
        if: failure()
        working-directory: rubash
        run: cargo build --release
      - name: locate binaries
        id: bins
        run: |
          $b = Get-ChildItem rubash/target/release -Filter 'bash.exe' | Select-Object -First 1
          $n = Get-ChildItem rubash/target/release -Filter 'rubash.exe' | Select-Object -First 1
          "bash=$($b.FullName)" >> $env:GITHUB_OUTPUT
          "rubash=$(if ($n) { $n.FullName } else { $b.FullName })" >> $env:GITHUB_OUTPUT
        shell: pwsh
      - name: download manifest
        uses: actions/download-artifact@v4
        with: { name: eco-manifest, path: eco }
      - name: run tester (untrusted assets, ephemeral runner)
        run: |
          python scripts/harvest/eco-test.py `
            --tiers "${{ github.event.inputs.test_tiers || 't1' }}" `
            --niu rubash/target/release/bash.exe `
            --rubash rubash/target/release/rubash.exe `
            --manifest-dir eco/manifest `
            --results-dir eco/results `
            --tmp-root eco/tmp
      - name: upload verdicts
        uses: actions/upload-artifact@v4
        with:
          name: eco-results-${{ github.run_id }}
          path: eco/results
