[package]
name = "niubash"
version = "1.4.4"
edition = "2021"
rust-version = "1.95"
license = "MIT"
authors = ["unixwin team <arookieofc@gmail.com>"]
description = "AI-native bash-compatible shell for Windows, built on rubash + winuxcmd"
readme = "README.md"
homepage = "https://github.com/unixwin/niubash"
repository = "https://github.com/unixwin/niubash"

[[bin]]
name = "niu"
path = "src/main.rs"

# niubash#464: the forwarding shim is niu's own binary now (it used to be
# built from the rubash repository and borrowed through the packager).
# scripts/package-release.ps1 builds it from this tree and stages one
# canonical copy as winuxcmd\usr\bin\niu-shim.exe; `niu --relink-shells`
# copies that payload to a bash/sh face wherever a hardlink cannot exist.
[[bin]]
name = "bash"
path = "src/bin/bash.rs"

[workspace]
members = [".", "crates/niubash-runtime"]
resolver = "2"

[dependencies]
niubash-runtime = { path = "crates/niubash-runtime", version = "1.4.3" }
rubash = { version = "1.4.3", git = "https://github.com/unixwin/rubash.git", branch = "master" }
# niubash#775 / ruline#8: the full GNU readline 8.x C ABI, implemented by
# ruline. Linked into niu so `enable -f` loadable builtins resolve `rl_*` /
# `history_*` against this executable; build.rs anchors every exported symbol
# in scripts/readline-abi-exports.txt. The lib name is `readline`
# (readline_abi is the package name).
readline-abi = { git = "https://github.com/unixwin/ruline", rev = "72d637438121c832558039db79181552bf1e60a6" }
anyhow = "1.0"
env_logger = "0.10"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# niubash#311: self-update verifies the downloaded installer against the
# release's published .sha256 sidecar before executing it (fail-closed).
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# Win32_System_Pipes/Win32_Security/Win32_Storage_FileSystem/Win32_System_Console:
# the niubash#245 piped-stdout pump (CreatePipe/SetStdHandle/GetFileType).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Security"] }

# rubash#827: build.rs stamps a `-dirty-<8 hex>` digest of the uncommitted
# rubash diff into the version banner (#488: a bare HEAD hash does not
# guarantee content). Same sha2 the crate already carries; build scripts
# cannot use the runtime dependency.
[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
# Interactive-mode regression harness (tests/interactive.rs): pseudo-terminal
# driver. Originally evaluated expectrl 0.9 (pexpect port), but its Windows
# backend (conpty 0.5.1) failed to attach the child to the pseudo console on
# Windows 10 19044: the child inherited the parent console instead and the
# pty streams stayed empty (reproduced with a plain `cmd /C echo` control).
# portable-pty 0.9 drives ConPTY correctly on the same host, so the driver
# is built on it for every case, on both Windows and Unix.
portable-pty = "0.9"

# Published-binary profile (measured on x64 MSVC against the default release
# profile): thin LTO + one codegen unit enables cross-crate DCE/inlining
# (11.9 MB -> 10.99 MB); panic=abort drops unwind tables and landing pads
# (10.99 MB -> 7.78 MB total). The codebase has no catch_unwind and the
# Ctrl+C handler is atomic-only, so no explicit recovery path relies on
# unwinding. Release-mode test runs match dev-profile results; CI keeps
# running the suite under the default dev profile.
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
# niubash#193: release artifacts shipped as "not stripped" (~12 MB ELF with
# full symbols; strip saves ~1 MB on disk and in self-update downloads).
# "symbols" (stable since Rust 1.59) strips the symbol table on every
# target the release pipeline builds (GNU/Linux, macOS, MSVC), so no
# per-platform strip step is needed in release.yml. On MSVC the exe itself
# is largely unaffected (debug info lives in the side-by-side .pdb); the
# win comes from the ELF/Mach-O Unix artifacts the release pipeline ships.
strip = "symbols"

# Local override for cross-repo compat runs (and the release pin lane):
# build niu against ../rubash (the release workflow clones the pinned
# rubash_rev there). The pin in scripts/release/rubash-pin.json and this
# path must agree on the Cargo.toml version recorded in Cargo.lock.
[patch."https://github.com/unixwin/rubash.git"]
rubash = { path = "../rubash" }

# The line editor is unixwin/ruline — an independent GNU-readline-compatible
# editor based on reedline 0.52.1 (MIT). It starts its own version line at
# 0.1.0; the package keeps the `reedline` name during the ABI transition so
# the source and this patch entry stay stable (rename tracked in ruline#9).
# The rev is pinned and bumped on demand only.
[patch.crates-io]
# Same rev as the `readline-abi` dependency above: the ABI adapter's path
# dependency on its workspace-root `reedline` must resolve to the copy niu
# already links, or the graph carries two editors.
reedline = { git = "https://github.com/unixwin/ruline", rev = "72d637438121c832558039db79181552bf1e60a6" }
