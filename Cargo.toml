[package]
name = "winuxsh"
version = "0.10.8"
edition = "2021"
rust-version = "1.70"
license = "GPL-3.0-or-later"
authors = ["unixwin team <arookieofc@gmail.com>"]
description = "AI-native bash-compatible shell for Windows, built on rubash + winuxcmd"
readme = "README.md"
homepage = "https://github.com/unixwin/winuxsh"
repository = "https://github.com/unixwin/winuxsh"

[workspace]
members = [".", "crates/winuxsh-runtime"]
resolver = "2"

[dependencies]
winuxsh-runtime = { path = "crates/winuxsh-runtime" }
rubash = { path = "../rubash" }
anyhow = "1.0"
env_logger = "0.10"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
sha2 = "0.10"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
