[package]
name = "niubash"
version = "1.2.1"
edition = "2021"
rust-version = "1.70"
license = "MIT"
authors = ["unixwin team <arookieofc@gmail.com>"]
description = "AI-native bash-compatible shell for Windows, built on rubash + winuxcmd"
readme = "README.md"
homepage = "https://github.com/unixwin/niubash"
repository = "https://github.com/unixwin/niubash"

[[bin]]
name = "niu"
path = "src/main.rs"

[workspace]
members = [".", "crates/niubash-runtime"]
resolver = "2"

[dependencies]
niubash-runtime = { path = "crates/niubash-runtime", version = "1.2.1" }
rubash = { version = "1.2.1", git = "https://github.com/unixwin/rubash.git", branch = "master" }
anyhow = "1.0"
env_logger = "0.10"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
sha2 = "0.10"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
# Interactive-mode regression harness (tests/interactive.rs): pseudo-terminal
# driver. Originally evaluated expectrl 0.9 (pexpect port), but its Windows
# backend (conpty 0.5.1) failed to attach the child to the pseudo console on
# Windows 10 19044: the child inherited the parent console instead and the
# pty streams stayed empty (reproduced with a plain `cmd /C echo` control).
# portable-pty 0.9 drives ConPTY correctly on the same host, so the driver
# is built on it for every case, on both Windows and Unix.
portable-pty = "0.9"

# Published-binary profile (measured on x64 MSVC against the default release
# profile): thin LTO + one codegen unit enables cross-crate DCE/inlining
# (11.9 MB -> 10.99 MB); panic=abort drops unwind tables and landing pads
# (10.99 MB -> 7.78 MB total). The codebase has no catch_unwind and the
# Ctrl+C handler is atomic-only, so no explicit recovery path relies on
# unwinding. Release-mode test runs match dev-profile results; CI keeps
# running the suite under the default dev profile.
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# Local override for cross-repo compat runs: build niu against the local
# rubash worktree (master + unpushed fixes) instead of the pinned git rev.
[patch."https://github.com/unixwin/rubash.git"]
rubash = { path = "../rubash" }
