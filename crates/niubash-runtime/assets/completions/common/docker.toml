description = "fetch the logs of a container"

[[subcommands.flags]]
short = "-f"
long = "--follow"
description = "follow log output"

[[subcommands.flags]]
long = "--tail"
description = "show the given number of lines from the end"
takes_value = true

[[subcommands.flags]]
short = "-t"
long = "--timestamps"
description = "show timestamps"

[[subcommands.flags]]
long = "--since"
description = "show logs since the given timestamp"
takes_value = true

[[subcommands.flags]]
long = "--until"
description = "show logs before the given timestamp"
takes_value = true

[[subcommands.flags]]
long = "--details"
description = "show extra details on log lines"

[[subcommands]]
name = "network"
description = "manage networks"

[[subcommands]]
name = "pause"
description = "pause all processes in a container"

[[subcommands]]
name = "port"
description = "list port mappings for a container"

[[subcommands]]
