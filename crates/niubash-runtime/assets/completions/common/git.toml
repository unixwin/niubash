# Issue #305: static completion table for git (subcommands + common flags).
# Hand-curated from git's documented CLI; no external completion script is
# executed. Same schema as the embedded applet definitions.
command = "git"
description = "Distributed version control system"

[[flags]]
long = "--version"
description = "print the git suite version"

[[flags]]
long = "--git-dir"
description = "set the path to the repository"
takes_value = true

[[flags]]
long = "--work-tree"
description = "set the path to the working tree"
takes_value = true

[[flags]]
short = "-C"
description = "run as if git was started in the given path"
takes_value = true
values_from = "path"

[[flags]]
short = "-c"
description = "pass a configuration parameter override"
takes_value = true

[[flags]]
short = "-p"
long = "--paginate"
description = "pipe all output into a pager"

[[flags]]
long = "--no-pager"
description = "do not pipe output into a pager"

[[flags]]
long = "--bare"
description = "treat the repository as a bare repository"

