long = "--file"
description = "use the given config file"
takes_value = true
values_from = "path"

[[subcommands.flags]]
short = "-l"
long = "--list"
description = "list all variables"

[[subcommands.flags]]
short = "-e"
long = "--edit"
description = "open the config file in an editor"

[[subcommands.flags]]
long = "--get"
description = "get the value of a key"
takes_value = true

[[subcommands.flags]]
long = "--get-all"
description = "get all values of a multi-valued key"
takes_value = true

[[subcommands.flags]]
long = "--get-regexp"
description = "get values of keys matching a pattern"
takes_value = true

[[subcommands.flags]]
long = "--add"
description = "add a new value to a multi-valued key"
takes_value = true

[[subcommands.flags]]
long = "--unset"
description = "remove a key"
takes_value = true

[[subcommands.flags]]
long = "--unset-all"
description = "remove all matches of a key"
takes_value = true

[[subcommands.flags]]
long = "--type"
description = "treat the value as the given type"
takes_value = true
values = ["bool", "int", "bool-or-int", "path", "expiry-date"]
