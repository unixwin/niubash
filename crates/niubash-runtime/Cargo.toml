[package]
name = "niubash-runtime"
version = "1.3.4"
edition = "2021"
rust-version = "1.70"
license = "MIT"
description = "Runtime crate for niubash: rubash-backed shell REPL on Windows"

[dependencies]
rubash = { version = "1.3.4", git = "https://github.com/unixwin/rubash.git", branch = "master" }
reedline = { version = "0.50", features = ["system_clipboard"] }
fd-lock = "4.0"
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "5.0"
filetime = "0.2"
sha2 = "0.10"
# Local trust-signature tier for plugin sources (`niu plugin source sign`):
# ed25519 over the tree digest with a machine-local key. rand_core (OS RNG)
# is only used for one-time key generation.
ed25519-dalek = { version = "2", default-features = false, features = ["rand_core", "fast"] }
rand_core = { version = "0.6", features = ["getrandom"] }
colored = "2.1"
log = "0.4"
env_logger = "0.10"
nu-ansi-term = "0.50"
# Display-width model shared with reedline's painter: the prompt channel's
# right-align split (niubash#169) must count CJK and wide glyphs exactly the
# way the editor's cursor accounting does.
unicode-width = "0.2"
globset = "0.4"
glob = "0.3"
png = "0.17"
crossterm = { version = "0.27", default-features = false, features = ["event-stream", "windows"] }
# reedline 0.50 speaks crossterm 0.29; the paste-chunk detector inspects the
# raw key events reedline hands it (ReedlineRawEvent wraps a crossterm 0.29
# Event), so it must name the SAME event types or the patterns would not
# typecheck against the payload.
crossterm29 = { package = "crossterm", version = "0.29", default-features = false, features = ["events"] }
# Download retraction (owner ruling 2026-10-04): the shell carries zero
# network/HTTP responsibility. ureq/flate2/tar/zip are gone; the only
# extension installation entry is `niu plugin add <git-url>` (git clone),
# and executable tools/fonts are package-manager recommendations.

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Security_Authorization", "Win32_System_Console", "Win32_System_Registry", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
