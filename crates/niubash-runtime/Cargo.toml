[package]
name = "niubash-runtime"
version = "1.0.0"
edition = "2021"
rust-version = "1.70"
license = "MIT"
description = "Runtime crate for niubash: rubash-backed shell REPL on Windows"

[dependencies]
rubash = { path = "../../../rubash" }
reedline = "0.33"
fd-lock = "4.0"
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "5.0"
filetime = "0.2"
sha2 = "0.10"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
colored = "2.1"
log = "0.4"
env_logger = "0.10"
nu-ansi-term = "0.50"
globset = "0.4"
glob = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"